name: Run pytest

on:
  pull_request:
    branches:
      - develop
      - patch/*
      - prep-release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    ## the DAQ nightly environment, as used in production and by runconf-ui
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - uses: actions/checkout@v5

      - name: Set up dev nightly
        run: |
          mkdir nightly
          cd nightly
          source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          setup_dbt latest_v5
          dbt-create -n last_fddaq
          cd NFD_DEV*
          source env.sh
          dbt-build
          dbt-workarea-env

      - name: Install runconftools
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd ../..
          python -m pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          cd nightly/NFD_DEV*
          source env.sh
          cd ../..
          pytest
